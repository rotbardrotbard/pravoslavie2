<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 630" width="1120" height="630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="80%">
      <stop offset="0" stop-color="#253040"/>
      <stop offset="0.55" stop-color="#1A222D"/>
      <stop offset="1" stop-color="#0E1319"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="55%" r="50%">
      <stop offset="0" stop-color="#E4B84C" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#E4B84C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F9E29B"/>
      <stop offset="0.45" stop-color="#E4B84C"/>
      <stop offset="1" stop-color="#9C7019"/>
    </linearGradient>
    <linearGradient id="goldDrum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9AC42"/>
      <stop offset="1" stop-color="#8A6415"/>
    </linearGradient>
    <linearGradient id="goldCross" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBE7A6"/>
      <stop offset="1" stop-color="#D9A93C"/>
    </linearGradient>
    <linearGradient id="goldTitle" x1="0" y1="80" x2="0" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7E08E"/>
      <stop offset="0.6" stop-color="#E4B84C"/>
      <stop offset="1" stop-color="#C79A2E"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3542"/>
      <stop offset="1" stop-color="#171E27"/>
    </linearGradient>
    <clipPath id="domeClip">
      <path d="M288 168 C258 232 152 268 152 336 C152 388 210 412 288 412 C366 412 424 388 424 336 C424 268 318 232 288 168 Z"/>
    </clipPath>
  </defs>

  <rect width="1120" height="630" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#E8EEF6">
    <circle cx="150" cy="70" r="1.6" opacity="0.25"/><circle cx="210" cy="130" r="1.2" opacity="0.18"/>
    <circle cx="100" cy="190" r="1.4" opacity="0.2"/><circle cx="920" cy="80" r="1.6" opacity="0.25"/>
    <circle cx="980" cy="150" r="1.2" opacity="0.18"/><circle cx="1030" cy="220" r="1.4" opacity="0.2"/>
    <circle cx="270" cy="60" r="1.2" opacity="0.15"/><circle cx="860" cy="60" r="1.2" opacity="0.15"/>
    <circle cx="330" cy="110" r="1" opacity="0.12"/><circle cx="800" cy="110" r="1" opacity="0.12"/>
    <circle cx="140" cy="265" r="1.3" opacity="0.15"/><circle cx="1005" cy="285" r="1.3" opacity="0.15"/>
  </g>

  <!-- glow behind temple + ground shadow -->
  <ellipse cx="560" cy="430" rx="340" ry="190" fill="url(#glow)"/>
  <ellipse cx="560" cy="566" rx="430" ry="14" fill="#000000" opacity="0.35"/>

  <!-- connecting wall -->
  <rect x="390" y="522" width="340" height="43" fill="#1B222C"/>

  <!-- side towers -->
  <path d="M296 508 L384 508 L402 565 L278 565 Z" fill="url(#wall)"/>
  <path d="M736 508 L824 508 L842 565 L718 565 Z" fill="url(#wall)"/>
  <path d="M332 552 v-14 a8 8 0 0 1 16 0 v14 z" fill="#F4C96B" opacity="0.8"/>
  <path d="M772 552 v-14 a8 8 0 0 1 16 0 v14 z" fill="#F4C96B" opacity="0.8"/>

  <!-- side drums -->
  <path d="M290 478 L370 478 L376 510 L284 510 Z" fill="url(#goldDrum)"/>
  <path d="M750 478 L830 478 L836 510 L744 510 Z" fill="url(#goldDrum)"/>

  <!-- side domes + crosses (icon geometry, scale 0.34) -->
  <g transform="translate(231.9,337.9) scale(0.34)">
    <rect x="279" y="54" width="18" height="124" rx="4" fill="url(#goldCross)"/>
    <rect x="252" y="88" width="72" height="16" rx="4" fill="url(#goldCross)"/>
    <rect x="240" y="114" width="96" height="18" rx="4" fill="url(#goldCross)"/>
    <path d="M288 168 C258 232 152 268 152 336 C152 388 210 412 288 412 C366 412 424 388 424 336 C424 268 318 232 288 168 Z" fill="url(#gold)"/>
    <g clip-path="url(#domeClip)">
      <ellipse cx="234" cy="318" rx="30" ry="76" fill="#FFE9A8" opacity="0.35" transform="rotate(16 234 318)"/>
    </g>
  </g>
  <g transform="translate(692.1,337.9) scale(0.34)">
    <rect x="279" y="54" width="18" height="124" rx="4" fill="url(#goldCross)"/>
    <rect x="252" y="88" width="72" height="16" rx="4" fill="url(#goldCross)"/>
    <rect x="240" y="114" width="96" height="18" rx="4" fill="url(#goldCross)"/>
    <path d="M288 168 C258 232 152 268 152 336 C152 388 210 412 288 412 C366 412 424 388 424 336 C424 268 318 232 288 168 Z" fill="url(#gold)"/>
    <g clip-path="url(#domeClip)">
      <ellipse cx="234" cy="318" rx="30" ry="76" fill="#FFE9A8" opacity="0.35" transform="rotate(16 234 318)"/>
    </g>
  </g>

  <!-- central tower -->
  <path d="M494 508 L626 508 L650 565 L470 565 Z" fill="url(#wall)"/>
  <path d="M522 550 v-16 a8 8 0 0 1 16 0 v16 z" fill="#F4C96B" opacity="0.85"/>
  <path d="M552 550 v-22 a8 8 0 0 1 16 0 v22 z" fill="#F4C96B" opacity="0.85"/>
  <path d="M582 550 v-16 a8 8 0 0 1 16 0 v16 z" fill="#F4C96B" opacity="0.85"/>
  <path d="M500 474 L620 474 L630 512 L490 512 Z" fill="url(#goldDrum)"/>

  <!-- central dome + cross (icon geometry, scale 0.55) -->
  <g transform="translate(401.6,247.6) scale(0.55)">
    <rect x="279" y="54" width="18" height="124" rx="4" fill="url(#goldCross)"/>
    <rect x="252" y="88" width="72" height="16" rx="4" fill="url(#goldCross)"/>
    <rect x="240" y="114" width="96" height="18" rx="4" fill="url(#goldCross)"/>
    <rect x="254" y="148" width="68" height="14" rx="4" fill="url(#goldCross)" transform="rotate(12 288 155)"/>
    <path d="M288 168 C258 232 152 268 152 336 C152 388 210 412 288 412 C366 412 424 388 424 336 C424 268 318 232 288 168 Z" fill="url(#gold)"/>
    <g clip-path="url(#domeClip)">
      <ellipse cx="234" cy="318" rx="30" ry="76" fill="#FFE9A8" opacity="0.35" transform="rotate(16 234 318)"/>
      <path d="M288 176 C258 236 204 280 202 344" fill="none" stroke="#8A6212" stroke-opacity="0.35" stroke-width="3"/>
      <path d="M288 176 C318 236 372 280 374 344" fill="none" stroke="#8A6212" stroke-opacity="0.35" stroke-width="3"/>
    </g>
  </g>

  <!-- title -->
  <text x="560" y="163" text-anchor="middle" font-family="Liberation Serif" font-weight="bold"
        font-size="96" letter-spacing="3" fill="#000000" opacity="0.45">ПРАВОСЛАВНЫЕ</text>
  <text x="560" y="160" text-anchor="middle" font-family="Liberation Serif" font-weight="bold"
        font-size="96" letter-spacing="3" fill="url(#goldTitle)">ПРАВОСЛАВНЫЕ</text>

  <!-- divider with small cross -->
  <rect x="336" y="190" width="200" height="4" rx="2" fill="#C79A2E" opacity="0.75"/>
  <rect x="584" y="190" width="200" height="4" rx="2" fill="#C79A2E" opacity="0.75"/>
  <rect x="557.5" y="174" width="5" height="36" rx="2" fill="url(#goldCross)"/>
  <rect x="552" y="180" width="16" height="5" rx="2" fill="url(#goldCross)"/>
  <rect x="547" y="187" width="26" height="6" rx="2" fill="url(#goldCross)"/>

  <!-- tagline -->
  <text x="560" y="252" text-anchor="middle" font-family="DejaVu Sans" font-size="29"
        fill="#C6D0DC">Календарь и святцы · Молитвослов · Библия · Карта храмов</text>
</svg>
